name: Upload Video to YouTube

on:
  # ── Manual trigger ───────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      source_url:
        description: |
          Video source URL(s) — ONE or MULTIPLE (paste one per line, or comma-separated):
            • Google Drive:      https://drive.google.com/file/d/FILE_ID/view?usp=sharing
            • GitHub Artifact:   https://github.com/OWNER/REPO/actions/runs/RUN_ID/artifacts/ARTIFACT_ID
            • Direct Video URL:  https://example.com/video.mp4  (or .zip)
        required: true
        type: string
      title:
        description: "Video title(s) (leave blank to use filenames; for multiple videos, separate with commas)"
        required: false
        type: string
      description:
        description: "Video description"
        required: false
        default: ""
        type: string
      tags:
        description: "Comma-separated tags  e.g. tutorial,python"
        required: false
        default: ""
        type: string
      category_id:
        description: "YouTube category ID (22 = People & Blogs)"
        required: false
        default: "22"
        type: string
      privacy:
        description: "Privacy status"
        required: false
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

  # ── API / repository_dispatch ────────────────────────────────────────────────
  # POST https://api.github.com/repos/{owner}/{repo}/dispatches
  # Body:
  # {
  #   "event_type": "upload_video",
  #   "client_payload": {
  #     "source_url": "https://... (or multiple URLs separated by newline/comma)",
  #     "title": "optional title(s)",
  #     "description": "",
  #     "tags": "tag1,tag2",
  #     "privacy": "private"
  #   }
  # }
  repository_dispatch:
    types: [upload_video]

jobs:
  upload:
    name: Download → Upload to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 120          # large videos may take a while

    permissions:
      contents: read              # required for actions/checkout to clone private repositories
      actions: read               # needed to download artifacts from THIS repo
                                  # for artifacts from OTHER repos use a PAT

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Free disk space ───────────────────────────────────────────────────
      - name: Free disk space
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          df -h /

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Disk usage AFTER cleanup ==="
          df -h /

      # ── 3. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. Resolve inputs (workflow_dispatch vs repository_dispatch) ─────────
      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE_URL="${{ github.event.inputs.source_url }}"
            TITLE="${{ github.event.inputs.title }}"
            DESC="${{ github.event.inputs.description }}"
            TAGS="${{ github.event.inputs.tags }}"
            CATEGORY="${{ github.event.inputs.category_id }}"
            PRIVACY="${{ github.event.inputs.privacy }}"
          else
            SOURCE_URL="${{ github.event.client_payload.source_url }}"
            TITLE="${{ github.event.client_payload.title }}"
            DESC="${{ github.event.client_payload.description }}"
            TAGS="${{ github.event.client_payload.tags }}"
            CATEGORY="${{ github.event.client_payload.category_id }}"
            PRIVACY="${{ github.event.client_payload.privacy }}"
          fi

          # Apply defaults
          CATEGORY="${CATEGORY:-22}"
          PRIVACY="${PRIVACY:-private}"

          # Detect source type for the summary later
          URL_COUNT=$(echo "$SOURCE_URL" | tr ',' '\n' | grep -v '^[[:space:]]*$' | wc -l)
          if [ "$URL_COUNT" -gt 1 ]; then
            SOURCE_TYPE="Multiple Sources ($URL_COUNT URLs)"
          elif echo "$SOURCE_URL" | grep -q "drive.google.com"; then
            SOURCE_TYPE="Google Drive"
          elif echo "$SOURCE_URL" | grep -qE "github\.com/.+/actions/runs/[0-9]+/artifacts/[0-9]+"; then
            SOURCE_TYPE="GitHub Artifact"
          else
            SOURCE_TYPE="Direct URL"
          fi

          # Export multi-line safe outputs using delimiter
          DELIM="EOF_$(date +%s)"
          echo "source_url<<$DELIM" >> $GITHUB_OUTPUT
          echo "$SOURCE_URL" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

          echo "title=$TITLE"             >> $GITHUB_OUTPUT

          echo "description<<$DELIM" >> $GITHUB_OUTPUT
          echo "$DESC" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

          echo "tags=$TAGS"               >> $GITHUB_OUTPUT
          echo "category=$CATEGORY"       >> $GITHUB_OUTPUT
          echo "privacy=$PRIVACY"         >> $GITHUB_OUTPUT
          echo "source_type=$SOURCE_TYPE" >> $GITHUB_OUTPUT

          echo "──────────────────────────────────────"
          echo "Source type : $SOURCE_TYPE"
          echo "Privacy     : $PRIVACY"
          echo "──────────────────────────────────────"

      # ── 6. Download + Upload ─────────────────────────────────────────────────
      - name: Download & Upload to YouTube
        id: upload
        env:
          # YouTube OAuth token (base64-encoded JSON)
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON || '' }}

          # Optional: helps fetch Google Drive file metadata
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # Required for GitHub Artifact downloads.
          # - artifacts from THIS repo:   use built-in secrets.GITHUB_TOKEN
          # - artifacts from OTHER repos: use a PAT stored as GH_PAT secret
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

          # Inputs passed safely via environment variables to avoid quoting/eval issues
          SOURCE_URL: ${{ steps.inputs.outputs.source_url }}
          VIDEO_TITLE: ${{ steps.inputs.outputs.title }}
          VIDEO_DESCRIPTION: ${{ steps.inputs.outputs.description }}
          VIDEO_TAGS: ${{ steps.inputs.outputs.tags }}
          VIDEO_CATEGORY: ${{ steps.inputs.outputs.category }}
          VIDEO_PRIVACY: ${{ steps.inputs.outputs.privacy }}

        run: |
          python scripts/upload.py

      # ── 7. Job summary ───────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        run: |
          echo "## ✅ Upload Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source type** | ${{ steps.inputs.outputs.source_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Privacy** | \`${{ steps.inputs.outputs.privacy }}\` |" >> $GITHUB_STEP_SUMMARY

          # Single-video outputs
          if [ -n "${{ steps.upload.outputs.video_id }}" ]; then
            echo "| **Title** | ${{ steps.upload.outputs.video_title }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Video ID** | \`${{ steps.upload.outputs.video_id }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **YouTube URL** | ${{ steps.upload.outputs.video_url }} |" >> $GITHUB_STEP_SUMMARY
          fi

          # Multi-video outputs (zip with multiple videos)
          if [ -n "${{ steps.upload.outputs.video_ids }}" ]; then
            echo "| **Video IDs** | \`${{ steps.upload.outputs.video_ids }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **YouTube URLs** | ${{ steps.upload.outputs.video_urls }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Write failure summary
        if: failure()
        run: |
          echo "## ❌ Upload Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common causes:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`YOUTUBE_TOKEN_JSON\` secret not set or expired → re-run \`generate_token.py\`" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Artifact: \`GH_PAT\` secret missing or lacks \`actions:read\` scope" >> $GITHUB_STEP_SUMMARY
          echo "- Google Drive file is not publicly shared" >> $GITHUB_STEP_SUMMARY
          echo "- Zip contains no recognised video files (.mp4, .mkv, .mov, …)" >> $GITHUB_STEP_SUMMARY
